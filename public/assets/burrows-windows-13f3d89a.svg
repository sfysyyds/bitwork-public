动 Burrows.exe</text></g><text x="24" y="565" font-size="19" fill="#f0f0f3" font-weight="600">游戏主目录</text><text x="606" y="565" font-size="19" fill="#f0f0f3" font-weight="600">补丁压缩包</text><text x="24" y="601" font-size="18" fill="#b5b5c0">拖到 Burrows.exe 所在目录的空白处，不是原 game 文件夹内部。</text><text x="24" y="634" font-size="16" fill="#92929e">合并时替换同名文件；不要先删除原 game 文件夹。</text></svg>