<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title>兽穴补丁安装：按实际Windows教程演示</title><desc>左侧是包含Burrows.exe的游戏主目录，右侧是已打开的补丁压缩包。把右侧game拖到左侧目录空白处，合并文件夹并替换同名文件。不要拖入原game内部，也不要删除原game。</desc><defs><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif}.reduced{display:none}@media(prefers-reduced-motion:reduce){.animated{display:none}.reduced{display:inline}}</style><g id="folder"><path d="M3 12V7a4 4 0 0 1 4-4h23l8 9h40a4 4 0 0 1 4 4v42H3Z" fill="#dba634" /><path d="M3 20h79v38a5 5 0 0 1-5 5H8a5 5 0 0 1-5-5Z" fill="#f4c55e" /><path d="M5 21h75" stroke="#ffdf88" stroke-width="2" /></g><g id="exe"><rect x="0" y="0" width="27" height="30" rx="4" fill="#356699" stroke="#96b6d7" /><path d="m8 7 12 8-12 8Z" fill="#e3f1ff" /></g><g id="file"><path d="M2 1h17l8 8v23H2Z" fill="#d0d4db" stroke="#8a929d" /><path d="M19 1v8h8" fill="none" stroke="#8a929d" /><path d="M7 19h14m-14 5h10" stroke="#687481" /></g><g id="zip"><rect x="0" y="0" width="25" height="29" rx="3" fill="#2d77a5" stroke="#8dc5e7" /><path d="M11 2v25m-3-20h6m-6 5h6m-6 5h6m-6 5h6" stroke="#f0d775" stroke-width="2" /></g></defs><rect width="1200" height="660" fill="#090a0d" /><g class="animated"><text x="24" y="38" font-size="22" fill="#f0f0f3" font-weight="600">① 左边打开游戏主目录，右边打开补丁压缩包</text><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.13;.16;.98;1" dur="12s" repeatCount="indefinite" calcMode="linear" /></g><g class="animated"><text x="24" y="38" font-size="22" fill="#f0f0f3" font-weight="600">② 把右侧 game 拖到左侧游戏目录的空白处</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.13;.16;.40;.43;1" dur="12s" repeatCount="indefinite" calcMode="linear" /></g><g class="animated"><text x="24" y="38" font-size="22" fill="#f0f0f3" font-weight="600">③ 如有同名文件提示，选择“替换目标中的文件”</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.40;.43;.64;.665;1" dur="12s" repeatCount="indefinite" calcMode="linear" /></g><g class="animated"><text x="24" y="38" font-size="22" fill="#f0f0f3" font-weight="600">正在合并补丁内容…</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.64;.665;.755;.78;1" dur="12s" repeatCount="indefinite" calcMode="linear" /></g><g class="animated"><text x="24" y="38" font-size="22" fill="#f0f0f3" font-weight="600">完成！双击 Burrows.exe 启动游戏</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.755;.79;.975;1" dur="12s" repeatCount="indefinite" calcMode="linear" /></g><g class="reduced"><text x="24" y="38" font-size="22" fill="#f0f0f3">右侧补丁 game → 左侧 Burrows.exe 所在目录 → 合并并替换</text></g><g><rect x="24" y="78" width="562" height="450" rx="9" fill="#191919" stroke="#55555c" /><rect x="31" y="85" width="270" height="32" rx="6" fill="#2c2c2d" stroke="#2c2c2d" /><use href="#folder" transform="translate(43 92) scale(0.24)" /><text x="74" y="107" font-size="15" fill="#d6d6dc">Beta-0.18.1-pc-hotfix</text><text x="475" y="101" font-size="15" fill="#d6d6dc">—</text><rect x="516" y="91" width="10" height="10" fill="none" stroke="#aaaab2" /><path d="M558 91l10 10m0-10-10 10" stroke="#aaaab2" /><text x="42" y="148" font-size="25" fill="#d6d6dc">‹</text><text x="76" y="148" font-size="25" fill="#66666f">›</text><text x="112" y="145" font-size="18" fill="#d6d6dc">↑</text><rect x="143" y="125" width="425" height="32" rx="5" fill="#2d2d2e" stroke="#404044" /><text x="158" y="147" font-size="14" fill="#d6d6dc">此电脑  ›  Beta-0.18.1-pc-hotfix</text><path d="M24 168h562" stroke="#35353a" /><text x="42" y="193" font-size="14" fill="#d6d6dc">＋ 新建</text><text x="140" y="193" font-size="14" fill="#d6d6dc">复制</text><text x="207" y="193" font-size="14" fill="#d6d6dc">粘贴</text><text x="283" y="193" font-size="14" fill="#d6d6dc">排序</text><text x="355" y="193" font-size="14" fill="#d6d6dc">查看</text><text x="442" y="193" font-size="19" fill="#d6d6dc">⋯</text><path d="M24 207h562" stroke="#35353a" /><rect x="25" y="208" width="103" height="292" rx="0" fill